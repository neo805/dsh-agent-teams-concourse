# dsh-agent-teams-concourse bundle patch：挂载组织层插件。
#
# 设计要点（详见 docs/REQUIREMENTS.html 与 DEVELOPMENT_PLAN.md）：
#  · NFR-1 惰性安装：enabled 缺省为 false，未启用时零行为变更、零监听器。
#  · 路线 A（D-P2）：自建组织层（顶点注册表 / 收件箱准入 / 任务板映射 / JSONL 台账），
