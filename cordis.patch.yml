#    不依赖 dsh-experimental-agent-team 的 roster/邮箱（R-9 已证伪，见 docs/spikes/）。
#  · 配置项（schemastery）：enabled（总开关）/ storagePath（JSONL 台账路径）。
- insert:
    - id: concourse
      name: dsh-agent-teams-concourse
